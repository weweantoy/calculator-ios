name: Calculator
options:
  bundleIdPrefix: com.workbuddy.calc
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  groupSortPosition: top
  generateEmptyDirectories: true
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_BITCODE: NO
    TARGETED_DEVICE_FAMILY: "1,2"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O

# Local SPM package(s)
packages:
  CalculatorCore:
    path: .

targets:
  CalculatorApp:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Resources/Info.plist"
          - "Resources/CalculatorApp.entitlements"
    dependencies:
      - package: CalculatorCore
        product: CalculatorCore
      - target: WidgetExtension
        embed: true
    resources:
      - path: App/Resources/Assets.xcassets
      - path: App/Resources/zh_CN.lproj
      - path: App/Resources/en.lproj
    info:
      path: App/Resources/Info.plist
    entitlements:
      path: App/Resources/CalculatorApp.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.workbuddy.calc
        INFOPLIST_FILE: App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Resources/CalculatorApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        # 关键：关闭 Xcode 自动生成 Info.plist，否则自定义 plist 中的
        # CFBundleDisplayName / CFBundleURLTypes / UILaunchScreen 等键会被丢弃
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    scheme:
      testTargets:
        - CalculatorAppUITests
      gatherCoverageData: true

  WidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetExtension/WidgetExtension
        excludes:
          - "Info.plist"
          - "WidgetExtension.entitlements"
    dependencies:
      - package: CalculatorCore
        product: CalculatorCore
    resources:
      - path: WidgetExtension/WidgetExtension/Assets.xcassets
    info:
      path: WidgetExtension/WidgetExtension/Info.plist
    entitlements:
      path: WidgetExtension/WidgetExtension/WidgetExtension.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.workbuddy.calc.widget
        INFOPLIST_FILE: WidgetExtension/WidgetExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: WidgetExtension/WidgetExtension/WidgetExtension.entitlements
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        # 必须关闭自动生成：Xcode 生成的 plist 不含 NSExtension 字典，
        # 会导致扩展不被识别为 Widget（小组件不出现在列表里）
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  CalculatorAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.workbuddy.calc.uitests
        TEST_TARGET_NAME: CalculatorApp

schemes:
  Calculator:
    build:
      targets:
        CalculatorApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CalculatorAppUITests
    archive:
      config: Release
