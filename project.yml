name: Calculator
options:
  bundleIdPrefix: com.workbuddy.calc
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  groupSortPosition: top
  generateEmptyDirectories: true
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_BITCODE: NO
    TARGETED_DEVICE_FAMILY: "1,2"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O

# Local SPM package(s)
packages:
  CalculatorCore:
    path: .

targets:
  CalculatorApp:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Resources/Info.plist"
          - "Resources/CalculatorApp.entitlements"
    dependencies:
      - package: CalculatorCore
        product: CalculatorCore
    resources:
      - path: App/Resources/Assets.xcassets
      - path: App/Resources/zh_CN.lproj
      - path: App/Resources/en.lproj
    info:
      path: App/Resources/Info.plist
    entitlements:
      path: App/Resources/CalculatorApp.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.workbuddy.calc
        INFOPLIST_FILE: App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Resources/CalculatorApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    scheme:
      testTargets:
        - CalculatorAppUITests
      gatherCoverageData: true

  CalculatorAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.workbuddy.calc.uitests
        TEST_TARGET_NAME: CalculatorApp

schemes:
  Calculator:
    build:
      targets:
        CalculatorApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CalculatorAppUITests
    archive:
      config: Release
