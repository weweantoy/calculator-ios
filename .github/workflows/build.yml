name: Build Calculator

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-core:
    name: Test Calculator Core
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Run Unit Tests
        run: |
          swift test --enable-test-discovery \
            --package-path .

  build-ipa:
    name: Build Unsigned IPA
    needs: build-core
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          # Xcode 15.4 不支持 objectVersion 77 (Xcode 16 格式), 降级到 56
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' Calculator.xcodeproj/project.pbxproj || true
          echo "objectVersion:" $(grep objectVersion Calculator.xcodeproj/project.pbxproj | head -1)

      - name: Archive (unsigned)
        run: |
          mkdir -p build
          # Xcode 17.5 SDK 不允许 ad-hoc 签名 → 走完全 unsigned 路径
          # Sideloadly 安装时会用自己的证书重新签名
          xcodebuild \
            -project Calculator.xcodeproj \
            -scheme Calculator \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Calculator.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean archive

      - name: Package IPA from xcarchive
        run: |
          # 直接从 xcarchive 中的 .app 打包成 IPA（绕过 xcodebuild exportArchive 的 Team 检查）
          # Sideloadly 安装时会用自己的签名重新签名
          mkdir -p build/Payload
          ditto \
            -c -k --sequesterRsrc --keepParent \
            build/Calculator.xcarchive/Products/Applications/CalculatorApp.app \
            build/Payload/CalculatorApp.app
          cd build
          # IPA 文件 = Payload 目录压缩成 zip，并改后缀为 .ipa
          zip -qr Calculator.ipa Payload
          ls -la Calculator.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-IPA
          path: build/Calculator.ipa
          if-no-files-found: error
          retention-days: 30