name: Build Calculator

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      team_id:
        description: 'Apple Developer Team ID (optional, for signing)'
        required: false

jobs:
  build-core:
    name: Test Calculator Core
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Run Unit Tests
        run: |
          swift test --enable-test-discovery \
            --package-path .

  build-ipa:
    name: Build Unsigned IPA
    needs: build-core
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          mkdir -p build
          xcodebuild \
            -project Calculator.xcodeproj \
            -scheme Calculator \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Calculator.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean archive

      - name: Export IPA
        run: |
          mkdir -p build/ExportOptions
          cat > build/ExportOptions/Unsign.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>
              <key>signingStyle</key>
              <string>manual</string>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath build/Calculator.xcarchive \
            -exportOptionsPlist build/ExportOptions/Unsign.plist \
            -exportPath build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-IPA
          path: build/Calculator.ipa
          if-no-files-found: error
          retention-days: 30
