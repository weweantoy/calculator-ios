name: Build Calculator

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-core:
    name: Test Calculator Core
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Run Unit Tests
        run: |
          swift test --enable-test-discovery \
            --package-path .

  build-ipa:
    name: Build Unsigned IPA
    needs: build-core
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          # Xcode 15.4 不支持 objectVersion 77 (Xcode 16 格式), 降级到 56
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' Calculator.xcodeproj/project.pbxproj || true
          echo "objectVersion:" $(grep objectVersion Calculator.xcodeproj/project.pbxproj | head -1)

      - name: Archive (unsigned)
        run: |
          mkdir -p build
          # Xcode 17.5 SDK 不允许 ad-hoc 签名 → 走完全 unsigned 路径
          # Sideloadly 安装时会用自己的证书重新签名
          xcodebuild \
            -project Calculator.xcodeproj \
            -scheme Calculator \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Calculator.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean archive

      # Xcode 15 的 infoPlistUtility 对自定义 Info.plist 应用严格白名单，
      # 会丢弃 CFBundleDisplayName / UILaunchScreen / CFBundleURLTypes 等键，
      # 并把 widget 的 NSExtension 整个砍掉。归档后再用 Python 注入回来。
      - name: Restore custom Info.plist keys
        run: |
          python3 - <<'PY'
          import os, plistlib
          AR='build/Calculator.xcarchive/Products/Applications/CalculatorApp.app'
          targets = [
              (AR + '/Info.plist', 'App/Resources/Info.plist'),
              (AR + '/PlugIns/WidgetExtension.appex/Info.plist',
               'WidgetExtension/WidgetExtension/Info.plist'),
          ]
          for dst, src in targets:
              if not (os.path.exists(dst) and os.path.exists(src)):
                  print('skip', dst, src)
                  continue
              with open(dst, 'rb') as f: t = plistlib.load(f)
              with open(src, 'rb') as f: s = plistlib.load(f)
              added = 0
              for k, v in s.items():
                  t[k] = v
                  added += 1
              with open(dst, 'wb') as f: plistlib.dump(t, f, fmt=plistlib.FMT_XML)
              print(f'merged {added} keys into {dst}')

          print('--- verification ---')
          with open(AR + '/PlugIns/WidgetExtension.appex/Info.plist', 'rb') as f: w = plistlib.load(f)
          print('widget NSExtension:', w.get('NSExtension'))
          with open(AR + '/Info.plist', 'rb') as f: a = plistlib.load(f)
          print('app CFBundleDisplayName:', a.get('CFBundleDisplayName'))
          print('app CFBundleURLTypes:', a.get('CFBundleURLTypes') is not None)
          print('app UILaunchScreen:', a.get('UILaunchScreen') is not None)
          PY

      - name: Package IPA from xcarchive
        run: |
          # 直接从 xcarchive 中的 .app 打包成 IPA（绕过 xcodebuild exportArchive 的 Team 检查）
          # Sideloadly 安装时会用自己的证书重新签名
          mkdir -p build/Payload
          cp -R build/Calculator.xcarchive/Products/Applications/CalculatorApp.app build/Payload/
          cd build
          zip -qr Calculator.ipa Payload/
          echo "--- IPA contents (first 25) ---"
          unzip -l Calculator.ipa | head -25
          ls -la Calculator.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-IPA
          path: build/Calculator.ipa
          if-no-files-found: error
          retention-days: 30
